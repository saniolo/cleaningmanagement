services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: cleaning
      POSTGRES_DB: cleaning_management
    ports:
      - "5433:5432" # host 5433: a native Postgres already occupies 5432 on this machine
    volumes:
      - cleaning_management_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaning -d cleaning_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cleaning_management_db:
